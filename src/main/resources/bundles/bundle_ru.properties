welcome.title = Foundation Battle
welcome.text = Добро пожаловать на открытый тест Foundation Battle!\n\n\
  [lightgray]Нажмите на свободную землю, чтобы основать свою команду, или вступите в чужую через [accent]/join[].

info.title = Как играть
info.text = [accent]Команды[]\n\
  Нажмите на свободную землю, чтобы основать команду и стать её лидером. До чужих ядер должно быть минимум {0}.\n\
  [accent]/join[] - заявка в команду, [accent]/team[] - меню команды, [accent]/spectate[] - покинуть команду.\n\n\
  [accent]Территория[]\n\
  Строить можно только в круге радиусом {1} вокруг своих ядер.\n\
  [accent]Хранилище[] становится ядром «Осколок», если до вражеских ядер минимум {2}.\n\
  Команда уничтожается, когда у неё не остаётся ни «Штаба», ни «Атома»: одни «Осколки» её не спасут.\n\n\
  [accent]Раунд[]\n\
  Раунд длится {3}. [accent]/restart[] - голосование за досрочный конец.\n\
  [accent]/lang[] - язык, [accent]/help[] - все команды.

