welcome.title = Foundation Battle
welcome.text = Welcome to the open test of Foundation Battle!\n\n\
  [lightgray]Tap free ground to found your own team, or use [accent]/join[] to join one.

info.title = How to play
info.text = [accent]Teams[]\n\
  Tap free ground at least {0} away from other cores to found a team and lead it.\n\
  [accent]/join[] - ask to join a team, [accent]/team[] - team menu, [accent]/spectate[] - leave your team.\n\n\
  [accent]Territory[]\n\
  You can build only within {1} of your cores - the circle around them.\n\
  A [accent]vault[] built at least {2} away from enemy cores turns into a Shard core.\n\
  A team is destroyed when it has no Foundation or Nucleus left: Shards alone don't keep it alive.\n\n\
  [accent]Round[]\n\
  A round lasts {3}. [accent]/restart[] starts a vote to end it early.\n\
  [accent]/lang[] changes the language, [accent]/help[] lists all commands.

