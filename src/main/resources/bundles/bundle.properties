# Foundation PvP - English texts, the base language. UTF-8.
# {0}, {1}... are arguments. Color tags like [accent] work as in the game.
# Plural forms: key.one / key.other here; other languages use their own forms (Russian: one, few, many).
# Aliases: command.<name>.aliases = a, b - extra command names, shown in /help to readers of this language.

language.name = English

